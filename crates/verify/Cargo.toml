[package]
name = "scoopy-verify"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
scoopy-media-info = { path = "../media-info" }
scoopy-project = { path = "../project" }
scoopy-recording = { path = "../recording" }
scoopy-timestamp = { path = "../timestamp" }

anyhow = { workspace = true }
ffmpeg = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
relative-path = "1.9.3"
rustfft = "6.4.1"
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
scoopy-verify-expect = { path = "../verify-expect" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
scoopy-enc-avfoundation = { path = "../enc-avfoundation" }
cidre = { workspace = true }

[dev-dependencies]
scoopy-recording = { path = "../recording", features = ["test-utils"] }
scoopy-editor = { path = "../editor", features = ["test-hooks"] }
scoopy-audio = { path = "../audio" }
scoopy-export = { path = "../export" }
scoopy-rendering = { path = "../rendering" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
scap-targets = { path = "../scap-targets" }
