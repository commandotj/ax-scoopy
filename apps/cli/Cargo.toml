[package]
name = "scoopy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.38"
scoopy-project = { path = "../../crates/project" }
scoopy-recording = { path = "../../crates/recording" }
scoopy-editor = { path = "../../crates/editor" }
scoopy-export = { path = "../../crates/export" }
scoopy-media-info = { path = "../../crates/media-info" }
scoopy-timestamp = { path = "../../crates/timestamp" }
scoopy-utils = { path = "../../crates/utils" }
relative-path = "1.9.3"
scoopy-camera = { path = "../../crates/camera" }
scoopy-cli-install = { path = "../../crates/cli-install" }
scap-targets = { path = "../../crates/scap-targets" }
serde = { workspace = true }
serde_json = "1.0.133"
tokio = { workspace = true, features = ["io-util", "net", "signal"] }
uuid = { version = "1.11.1", features = ["v4"] }
ffmpeg = { workspace = true }
kameo = "0.17.2"
flume = { workspace = true }
futures = { workspace = true }
dirs = "6.0.0"
image = { version = "0.25.2", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
open = "5.3.6"
tracing.workspace = true
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
cpal = { workspace = true }
winit = "0.30"
softbuffer = "0.4"
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { workspace = true }
scap-screencapturekit = { path = "../../crates/scap-screencapturekit" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
