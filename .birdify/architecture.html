[data-theme="light"] .node.completed{background:#e9f3ed;border-color:#3c8461;box-shadow:none}

实现结果仍未验证。"},"category-delivery":{"body":"# 协作与交付\n\n- **Default to no code comments**：When writing or editing code in any language\n- **Never hand-edit generated files**：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts\n- **Rust clippy-clean and post-edit checks**：When modifying any Rust file in apps or crates\n- **TypeScript Biome formatting and linting**：When modifying TS, JS, JSON, CSS, or MD files\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"topic-delivery-code-invariants":{"body":"# Code Generation Invariants\n\n- **Default to no code comments**：When writing or editing code in any language\n- **Never hand-edit generated files**：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts\n- **Rust clippy-clean and post-edit checks**：When modifying any Rust file in apps or crates\n- **TypeScript Biome formatting and linting**：When modifying TS, JS, JSON, CSS, or MD files"},"rule-no-code-comments":{"body":"# Default to no code comments\n\n## 什么时候用\n\nWhen writing or editing code in any language\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nCode should be self-documenting. Comments are reserved for non-obvious fixes, trade-offs, or upstream platform bug workarounds.\n\n## 怎么检查\n\nInspect git diff before declaring task completion.\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:8-8`\n\n> - **Default to no code comments. Add a comment only after solving a bug or working through a complex issue, and only when it captures non-obvious context that a future investigator or reviewer genuinely needs** — e.g. why the fix looks the way it does, the upstream/platform bug being worked around, a non-obvious invariant or trade-off chosen after investigation, or a link to the PR/issue that explains the decision. Bad cases that remain banned: narrating what the code does, restating types, JSDoc that paraphrases parameter names, \"TODO: refactor\" or \"this should be cleaner\" notes, and any comment that just describes the change you are currently making. When in doubt, prefer better naming/types over a comment. Applies to every language: Rust, TS, JS, Python, shell, SQL, TOML, etc.\n\n来源文件最后修改：2026-10-09T07:32:45Z。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv2 · 2026-05-11T19:05:09+01:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba\n\n- 9150f90a0e9e8abc38d3f61c68e2cb13088ff117 · 2026-05-11T19:05:09+01:00\n- d80308fb298ff303ccfd9364874f79db2b92e81f · 2026-04-23T17:14:48+01:00"},"rule-no-edit-generated-files":{"body":"# Never hand-edit generated files\n\n## 什么时候用\n\nWhen touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nGenerated bindings and types (e.g. tauri.ts, auto-imports.d.ts) must only be updated by generators, never edited manually.\n\n## 怎么检查\n\nCheck git diff to confirm no manual edits to generated targets.\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:9-9`\n\n> - **Never hand-edit generated files**: `**/tauri.ts`, `apps/desktop/src-tauri/gen/**`, `packages/ui-solid/src/auto-imports.d.ts`, Drizzle migration SQL under `packages/database/migrations/`. These are regenerated (e.g. `tauri.ts` only on debug desktop runs) but stay committed because CI typecheck and fresh clones depend on them; commit binding changes alongside the Rust change that produced them. For database schema changes, run `bun run db:generate` and commit the generated SQL, snapshot, and journal changes alongside the schema change. Generating and committing these artifacts is required; modifying generated output by hand is prohibited. Note: `apps/desktop/src/utils/queries.ts` is hand-written, not generated — edit it normally.\n\n来源文件最后修改：2026-10-09T07:32:45Z。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv4 · 2026-09-09T16:22:33+01:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba\n\n- 9e08451e19712e7d7ec3840e9ae3cf4c13701c18 · 2026-09-09T16:22:33+01:00\n- c538e9d4d8bd495d2f4894981dd627ab75e6a868 · 2026-09-06T15:06:55+01:00\n- 2650a1eaabaae0391315cbed41beb59800ef98d2 · 2026-06-18T14:25:40+01:00\n- d80308fb298ff303ccfd9364874f79db2b92e81f · 2026-04-23T17:14:48+01:00"},"rule-rust-clean-first-time":{"body":"# Rust clippy-clean and post-edit checks\n\n## 什么时候用\n\nWhen modifying any Rust file in apps or crates\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nWrite clippy-clean Rust on first emission. Run cargo fmt --all and cargo check -p \u003ccrate> when touching Rust code.\n\n## 怎么检查\n\nRun cargo fmt --all and cargo check -p \u003ccrate> on the modified crate.\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:14-14`\n\n> - Touched any Rust file → `cargo fmt --all` and `cargo check -p \u003ccrate>`. Add `--all-targets`, `--workspace`, or clippy only when explicitly requested, when preparing CI/PR final validation, or when the change needs broader coverage.\n\n来源文件最后修改：2026-10-09T07:32:45Z。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv4 · 2026-08-23T16:48:17+01:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba\n\n- e23d4c619020ac482d7a98abeab11dce3e8fd79a · 2026-08-23T16:48:17+01:00\n- 7bd58e1e4083e62545efd066be0318fce7d8bc07 · 2026-08-16T19:24:23+01:00\n- af312b9c17bbcd36639b5de45ecf00022e0a5918 · 2026-05-08T12:51:29+01:00\n- d80308fb298ff303ccfd9364874f79db2b92e81f · 2026-04-23T17:14:48+01:00"},"rule-biome-clean-first-time":{"body":"# TypeScript Biome formatting and linting\n\n## 什么时候用\n\nWhen modifying TS, JS, JSON, CSS, or MD files\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nEnforce tab indentation, double quotes, and Biome lint rules. Run bun run biome check --write on touched files.\n\n## 怎么检查\n\nRun bun run biome check --write \u003cfiles> on touched files.\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:15-15`\n\n> - Touched any TS / JS / JSON / CSS / MD file → run the narrowest applicable formatter/linter on touched files first, such as `bun run biome check --write \u003cfiles>`. Use full `bun run format`, `bun run lint`, and `bun run typecheck` only when explicitly requested or when the change spans shared types/packages.\n\n来源文件最后修改：2026-10-09T07:32:45Z。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv3 · 2026-09-09T16:22:33+01:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba\n\n- 9e08451e19712e7d7ec3840e9ae3cf4c13701c18 · 2026-09-09T16:22:33+01:00\n- af312b9c17bbcd36639b5de45ecf00022e0a5918 · 2026-05-08T12:51:29+01:00\n- d80308fb298ff303ccfd9364874f79db2b92e81f · 2026-04-23T17:14:48+01:00"},"topic-lifecycle-dev-environment":{"body":"# Development Environment\n\n- **Never start additional dev servers**：When executing tasks or dev harness verification"},"rule-no-extra-dev-servers":{"body":"# Never start additional dev servers\n\n## 什么时候用\n\nWhen executing tasks or dev harness verification\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\nAssume development servers (bun run dev, dev:desktop) are already running to avoid port collisions and profile locks.\n\n## 怎么检查\n\nInspect running processes to ensure no redundant servers are spawned.\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:10-10`\n\n> - **Never start additional dev servers** (`bun run dev`, `bun run dev:web`, `bun run dev:desktop`, Docker services). Assume they are already running. The `/building` workflow may start a session-owned web server in its isolated worktree on an allocated port through its environment wrapper, or services inside its owned sandbox. This exception does not permit restarting shared services or launching a native app against the user's existing profile.\n\n来源文件最后修改：2026-10-09T07:32:45Z。文件历史不作为规则版本。\n\n## 规则原文版本\n\nv5 · 2026-09-24T15:33:36-07:00\n\n按 Git 原文行段历史计数，不是语义版本，也不是提炼解释的修订次数。移动、格式修改或共同段落可能影响计数。\n\n快照：9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba\n\n- 119edf04864b59abfc0d52f60bf77d7f33cfd2b8 · 2 en executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-0":{"body":"# .agents/skills/building/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: building\n> description: Build Cap features in isolated Git worktrees with PlanetScale development branches, shared dependency caches, recorded feature demonstrations, and plain-language pull requests. Use for /building or $building requests, including resuming an existing building session. Ordinary coding requests do not select this publishing workflow.\n> ---\n> \n> # Building Cap\n> \n> Use `/building \u003crequest>` in Cursor or Claude Code, or `$building \u003crequest>` in Codex. Each invocation authorizes implementing the feature in a new worktree, provisioning its disposable development resources, running verification, recording and uploading a demonstration into the user's `PR's` Cap folder, and opening a pull request. Honor narrower user instructions. Merging and production deployment remain separate actions.\n> \n> Use the repository containing the requested Cap project. Keep the original checkout, its index, branches, running services, and recordings untouched. This workflow replaces the shared-checkout mechanics of `$build`; do not invoke that skill inside this workflow.\n> \n> The helper is `scripts/building.mjs` relative to this skill. Use its absolute path when working in a newly created worktree, which might predate the repository copy of this skill. Run `npm ci --prefix \u003cskill-directory> --ignore-scripts --no-audit --no-fund` once if the provider dependencies are missing. `node \u003chelper> help` lists commands. Read [editors.md](references/editors.md) when installing or checking discovery in another editor; all editors use the same scripts and session registry.\n> \n> ## Publication privacy\n> \n> Use neutral GitHub metadata. Branch names, commit messages, PR titles/descriptions, comments, release notes, and demo titles must not mention Codex, Cursor, Claude, model names, or automated authorship. Use `building/\u003cfeature>-\u003cid>` branches and conventional commit titles describing the actual change. Never add tool signatures, generated-by text, co-author trailers, or other attribution. This naming rule applies whichever editor runs the workflow.\n> \n> Never put secrets, sensitive information, or real people's personal data in committed content, filenames, commit messages, GitHub PR titles/descriptions, comments, attachments, or linked demonstrations. This includes credentials, tokens, cookies, signed URLs, connection strings, customer names, email addresses, phone numbers, account identifiers, recordings, and private support or billing details. Choose public-safe feature names before creating branches, recipes, or video titles. Use synthetic fixtures and reserved example domains. Keep raw logs, local absolute paths, database/provider receipts, and session state out of Git and GitHub text; a private repository is not an exception.\n> \n> Before every commit, inspect the exact staged diff and proposed message. Before every push, review all outgoing commits, including intermediate versions that a later commit removes. Before each GitHub write or Cap upload, inspect the final text or media actually being published. Summarize test outcomes in safe language instead of pasting commands or raw output; inspect screenshots, video frames, and audio too. Use an available secret scanner as an additional check, never as proof that personal data is absent. Use the user's established public Git identity and GitHub no-reply email rather than publishing a private author or committer email; do not alter shared Git configuration.\n> \n> If anything sensitive appears or cannot be confidently classified, sanitize or replace it before proceeding. Do not publish first and clean it up later. If exposure has already occurred, stop further publication, report the affected artifact without repeating the value, and coordinate credential revocation and history cleanup rather than silently force-pushing. Do not silently redact application behavior or required source values; use configuration or synthetic fixtures and preserve the intended feature.\n> \n> ## Prepare and resume\n> \n> Read the selected repository's instructions. Fetch the remote default branch without moving the original checkout. Run `new --repo \u003crepo> --name \u003cshort-feature-name> --target web|desktop|gpui|fullstack --base \u003cremote-default-ref>` and use the returned worktree for every source edit, generator, command, commit, and push. Resume with the existing session ID; do not create replacement resources after an uncertain response.\n> \n> Read [environment.md](references/environment.md) before provisioning. Prefer the PlanetScale MCP to create the exact development branch named in the session, then run `database-attach`. The authenticated `database-create` helper is the fallback when that MCP is unavailable. Never attach production, staging, another session's branch, or production credentials. Create expiring credentials and seed the owned development branch. Generate migrations through Cap's existing generator; never edit generated SQL or metadata by hand.\n> \n> Run short commands through the helper's `run` wrapper and long-lived servers through `serve` so inherited production integration credentials and unmanaged dotenv files cannot accidentally configure the feature. Explicitly configure only required test services. There is no automatic production fallback for storage, payments, email, OAuth, or media processing.\n> \n> Read [desktop.md](references/desktop.md) when native crates or desktop applications are involved. Use Bun's shared package cache and private installations. Warm private native/build directories using copy-on-write only from a matching, idle checkout. Never symlink a writable `target`, whole `node_modules`, app profile, or user recording directory between worktrees.\n> \n> ## Implement and verify\n> \n> Make the smallest complete change, trace its callers and platform behavior, and apply repository checks to the affected scope. Preserve an acceptance checklist including error states, permissions, and old data. Establish the demo's expected behavior before implementation; assertions must test that behavior, not just successful page loading.\n> \n> Commit coherent changes in the owned worktree. Run final checks through `check` so successful results are bound to the committed SHA. Recheck against current remote main, including generated migration conflicts and deployment ordering. A successful Git merge simulation does not prove runtime compatibility.\n> \n> Read [recording.md](references/recording.md) for the Daytona/Cap path. Use a tracked, reviewed feature recipe and an assertion-driven walkthrough of the actual change. Before credentialed capture, independently inspect source provenance, changed code and dependencies, recipe commands, and credential scope, then record the actual SHA-bound review with `capture-review`. Untrusted or fork-controlled code receives no credentials until that review is complete. Verify the resulting video's content and reviewer access in a browser before calling it a successful demonstration. Use `preview` for local feature browsing: each session gets a separate Chrome profile, preventing cookies and local storage from colliding across ports. Preserve failed evidence; never replace a failed Cap CLI capture with a different recorder without reporting the change.\n> \n> For macOS/Windows-specific behavior, obtain evidence on that OS. Linux browser or native demonstrations do not establish other-platform behavior. Infrastructure-only changes can give a concrete nonvisual explanation and relevant test evidence instead of a staged visual demo.\n> \n> ## Publish\n> \n> Create or reuse a draft PR for the owned branch, then record its URL using `pr`. Push only the feature branch without force. Keep the PR draft while required verification, video playback, native checks, or review remain incomplete. Do not let fork PR code run with provider or publishing credentials in privileged CI.\n> \n> Upload the verified capture using `share`; the helper finds or creates `PR's` and moves the video there. An uncertain upload must be reconciled by its recorded title/ID, never blindly repeated. Write a short ELI5 file explaining the previous problem, the new behavior, and its benefit. `pr-body --eli5 \u003cfile>` produces a starting body with the recording and current-SHA checks. Add factual migration notes, platform coverage, and remaining limitations; remove limitations only after verification. Use `gh pr edit --body-file`, preserving unrelated reviewer-authored content.\n> \n> Use the installed `greptile-pr-loop` skill when available, fixing actionable findings through its stop condition. Any changed commit invalidates old evidence: rerun affected checks, update the recording, and review the final PR head. In Codex, attach the created PR to the current task using `attach_artifact` when available; Cursor and Claude Code can report the GitHub URL directly. These editor integrations are optional; resource management uses the shared CLI. Mark it ready only after the required gates pass; otherwise report the concrete blocker and keep the draft.\n> \n> ## Finish\n> \n> Delete owned Daytona sandboxes after evidence is downloaded; the helper also sets expiry limits. After the PR is published, required checks pass, and the Cap upload is verified playable and accessible, run `finish` automatically. It stops owned server processes and removes the disposable development database and clean, published worktree while the PR remains open. Do not keep paid previews running unless the user asks for one. Keep recordings, Git branches, receipts, and shared caches. `resume` recreates the worktree from its retained feature branch; reprovision and reseed its development database for follow-up work. `close` also supports cleanup after a PR is merged or closed. Never delete resources based on age alone or break a lock without checking its host, process, and pending operation.\n> \n> Report the PR, Cap link, actual checks, unverified platforms, and retained resources. Do not call a scaffold, a passing compile, or an accepted upload end-to-end success."},"directory-source-1":{"body":"# AGENTS.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- Default to no code comments\n- Never hand-edit generated files\n- Rust clippy-clean and post-edit checks\n- TypeScript Biome formatting and linting\n- Never start additional dev servers\n\n## 原文 / Source\n\n> # Repository Guidelines\n> \n> ## Pre-Generation Invariants (read BEFORE writing any code)\n> \n> These rules are enforced by CI (`cargo clippy -D warnings`, Biome). Fixing them afterwards is wasted effort — emit code in the correct shape the FIRST time. Every CI failure caused by one of these rules means the agent didn't read this section.\n> \n> ### Zero-tolerance rules\n> - **Default to no code comments. Add a comment only after solving a bug or working through a complex issue, and only when it captures non-obvious context that a future investigator or reviewer genuinely needs** — e.g. why the fix looks the way it does, the upstream/platform bug being worked around, a non-obvious invariant or trade-off chosen after investigation, or a link to the PR/issue that explains the decision. Bad cases that remain banned: narrating what the code does, restating types, JSDoc that paraphrases parameter names, \"TODO: refactor\" or \"this should be cleaner\" notes, and any comment that just describes the change you are currently making. When in doubt, prefer better naming/types over a comment. Applies to every language: Rust, TS, JS, Python, shell, SQL, TOML, etc.\n> - **Never hand-edit generated files**: `**/tauri.ts`, `apps/desktop/src-tauri/gen/**`, `packages/ui-solid/src/auto-imports.d.ts`, Drizzle migration SQL under `packages/database/migrations/`. These are regenerated (e.g. `tauri.ts` only on debug desktop runs) but stay committed because CI typecheck and fresh clones depend on them; commit binding changes alongside the Rust change that produced them. For database schema changes, run `bun run db:generate` and commit the generated SQL, snapshot, and journal changes alongside the schema change. Generating and committing these artifacts is required; modifying generated output by hand is prohibited. Note: `apps/desktop/src/utils/queries.ts` is hand-written, not generated — edit it normally.\n> - **Never start additional dev servers** (`bun run dev`, `bun run dev:web`, `bun run dev:desktop`, Docker services). Assume they are already running. The `/building` workflow may start a session-owned web server in its isolated worktree on an allocated port through its environment wrapper, or services inside its owned sandbox. This exception does not permit restarting shared services or launching a native app against the user's existing profile.\n> \n> ### Post-edit checks (run before you say \"done\")\n> - Prefer scoped, fast checks over full workspace gates. Do not run long full-repo checks by default.\n> - Touched any Rust file → `cargo fmt --all` and `cargo check -p \u003ccrate>`. Add `--all-targets`, `--workspace`, or clippy only when explicitly requested, when preparing CI/PR final validation, or when the change needs broader coverage.\n> - Touched any TS / JS / JSON / CSS / MD file → run the narrowest applicable formatter/linter on touched files first, such as `bun run biome check --write \u003cfiles>`. Use full `bun run format`, `bun run lint`, and `bun run typecheck` only when explicitly requested or when the change spans shared types/packages.\n> - Touched DB schema → `bun run db:generate` before relying on it.\n> \n> ### Rust — write the clippy-clean form the FIRST time\n> All patterns below are `deny` in the workspace `[workspace.lints]` in `Cargo.toml`. Do not emit the left column; always emit the right column.\n> \n> | ❌ Don't write | ✅ Write instead | Lint |\n> |---|---|---|\n> | `dbg!(x)` | `tracing::debug!(?x)` (or delete it) | `dbg_macro` |\n> | `let _ = async_fn();` | `async_fn().await;` or `tokio::spawn(async_fn());` | `let_underscore_future` |\n> | `a - b` for `Duration`/`Instant` | `a.saturating_sub(b)` | `unchecked_time_subtraction` |\n> | `if a { if b { … } }` | `if a && b { … }` | `collapsible_if` |\n> | `x.clone()` when `x: Copy` | `x` | `clone_on_copy` |\n> | `iter.map(\\|x\\| foo(x))` | `iter.map(foo)` | `redundant_closure` |\n> | `fn f(v: &Vec\u003cT>)` / `fn f(s: &String)` | `fn f(v: &[T])` / `fn f(s: &str)` | `ptr_arg` |\n> | `v.len() == 0` / `v.len() > 0` | `v.is_empty()` / `!v.is_empty()` | `len_zero` |\n> | `let _ = unit_returning();` | `unit_returning();` | `let_unit_value` |\n> | `opt.unwrap_or_else(\\|\\| 42)` (cheap default) | `opt.unwrap_or(42)` | `unnecessary_lazy_evaluations` |\n> | `for i in 0..v.len() { v[i] … }` | `for item in &v { … }` or `.iter().enumerate()` | `needless_range_loop` |\n> | `value.min(max).max(min)` | `value.clamp(min, max)` | `manual_clamp` |\n> \n> Additionally, `unused_must_use = \"deny\"` applies to all Rust code: every `Result`, `Option`, and `#[must_use]` value must be explicitly handled (`?`, `.unwrap()`, `.ok()`, `let _ = …;` **is not allowed** for unit-returning calls — see `let_unit_value`; it is the correct escape hatch for `Result`-returning calls you consciously discard, e.g. `let _ = tx.send(msg);`).\n> \n> ### TypeScript / JavaScript — write the Biome-clean form the FIRST time\n> `biome.json` at repo root enforces (do not override locally):\n> - **Indent: tab.** Not two spaces, not four spaces. New files and edits must use tabs.\n> - **Quotes: double.** `\"foo\"`, never `'foo'`, for JS/TS string literals.\n> - **`organizeImports: on`** — imports are sorted/grouped automatically; don't leave unused imports or hand-sort against the grain.\n> - **Recommended lint ruleset is on**, with `suspicious.noShadowRestrictedNames` disabled. Everything else (unused vars, `noExplicitAny`, dead code, etc.) applies.\n> - Desktop code under `apps/desktop/**` has a11y rules disabled; they are enforced everywhere else (`apps/web`, `packages/ui`, etc.).\n> - CSS overrides: `noUnknownAtRules`, `noUnknownTypeSelector`, `noDescendingSpecificity` are off for `**/*.css`.\n> \n> ### TypeScript — strictness\n> - Avoid `any`. Use `unknown` + narrowing, or existing shared types from `@cap/utils`, `@cap/web-domain`, generated bindings, etc.\n> - Do not introduce `@ts-expect-error` / `@ts-ignore` without a concrete reason. Prefer fixing the type.\n> \n> ## Project Structure & Modules\n> - Turborepo monorepo:\n>   - `apps/desktop-gpui` (GPUI, ships as Cap), `apps/desktop` (Tauri v2 + SolidStart; last shipped in 0.6.0, kept for the dev harness), `apps/web` (Next.js), `apps/cli` (Rust CLI).\n>   - `packages/*` shared libs (e.g., `database`, `ui`, `ui-solid`, `utils`, `web-*`).\n>   - `crates/*` Rust media/recording/rendering/camera crates.\n>   - `scripts/*`, `infra/`, and `packages/local-docker/` for tooling and local services.\n> - Marketing and lifecycle emails (copy, Loops journeys and campaigns, the email catalogue and voice guide) and their Loops tooling live in the private repo [CapSoftware/cap-marketing](https://github.com/CapSoftware/cap-marketing). View and edit them there. This repo keeps only the runtime profile sync in `packages/database/loops/` (with its tests and runners in `scripts/loops/`) and the transactional emails in `packages/database/emails/`.\n> \n> ## Build, Test, Develop\n> - Install: `bun install`; setup: `bun run env-setup` then `bun run cap-setup`.\n> - Dev: `bun run dev` (web+desktop). Desktop only: `bun run dev:desktop`. Web only: `bun run dev:web` or `cd apps/web && bun run dev`.\n> - Build: `bun run build` (Turbo). Desktop release: `bun run gpui:build \u003ctarget>` (Cap ships as the GPUI app only).\n> - DB: `bun run db:generate` → `bun run db:push` → `bun run db:studio`.\n> - Docker: `bun run docker:up | docker:stop | docker:clean`.\n> - Quality: `bun run lint`, `bun run format`, `bun run typecheck`. Rust: `cargo build -p \u003ccrate>`, `cargo test -p \u003ccrate>`.\n> \n> ## Coding Style & Naming\n> - TypeScript / JS / JSON / CSS: **tab indent** and **double-quoted** strings, enforced by Biome (see `biome.json`). Do not configure per-file overrides.\n> - Rust: `rustfmt` default style + the denied clippy lints in the Pre-Generation Invariants above.\n> - Naming: files kebab‑case (`user-menu.tsx`); React/Solid components PascalCase; hooks `useX`; Rust modules snake_case; crates kebab‑case.\n> - Runtime: Node 20, Bun 1.4.0, Rust 1.88+, Docker for MySQL/MinIO.\n> \n> (See **Pre-Generation Invariants** at the top of this file for the comments policy and the denied clippy/Biome patterns. Those are the source of truth — do not duplicate or weaken them here.)\n> \n> ## Testing\n> - TS/JS: Vitest where present (e.g., desktop). Name tests `*.test.ts(x)` near sources.\n> - Rust: `cargo test` per crate; tests in `src` or `tests`.\n> - Prefer unit tests for logic and light smoke tests for flows; no strict coverage yet.\n> \n> ## Commits & PRs\n> - Conventional style: `feat:`, `fix:`, `chore:`, `improve:`, `refactor:`, `docs:` (e.g., `fix: hide watermark for pro users`).\n> - Never add `Co-authored-by` or other attribution trailers (Cursor, Cursor Agent, or anyone else). Commit as the user only.\n> - PRs: clear description, linked issues, screenshots/GIFs for UI, env/migration notes. Keep scope tight and update docs when behavior changes.\n> \n> ## Agent‑Specific Practices\n> - Do not start extra servers; use `bun run dev:web` or `bun run dev:desktop` as needed.\n> - Prefer existing scripts and Turbo filters over ad‑hoc commands; clear `.turbo` only when necessary.\n> - Database flow: always `db:generate` → `db:push` before relying on new schema.\n> - Keep secrets out of VCS; configure via `.env` from `bun run env-setup`.\n> - macOS note: desktop permissions (screen/mic) apply to the terminal running `bun run dev:desktop`.\n> - All other agent-facing rules (comments policy, no editing generated files, clippy/Biome shape, post-edit gates) live in **Pre-Generation Invariants** at the top of this file.\n> \n> ## Deep Investigation Default\n> When asked to inspect, review, optimize, secure, or fix something, do not stop at the obvious local change. First trace the full path and run a second-pass blast-radius review:\n> \n> - identify the real root cause, not only the symptom\n> - trace callers, side effects, async/runtime behavior, generated artifacts, caches, exports, old data, and platform-specific paths\n> - compare old vs new behavior when reviewing a diff\n> - call out what is verified vs merely plausible\n> - consider likely follow-up reviewer or user reports before calling it done\n> - verify the actual user-visible outcome where practical, not only compile/lint success\n> \n> Prefer the smallest correct fix, but only after checking whether the narrow fix misses related consequences.\n> \n> ## Effect Usage\n> - Next.js API routes in `apps/web/app/api/*` are built with `@effect/platform`'s `HttpApi` builder; copy the existing class/group/endpoint pattern instead of ad-hoc handlers.\n> - Acquire backend services (e.g., `Videos`, `S3Buckets`) inside `Effect.gen` blocks and wire them through `Layer.provide`/`HttpApiBuilder.group`, translating domain errors to `HttpApiError` variants.\n> - Convert the effectful API to a Next.js handler with `apiToHandler(ApiLive)` from `@/lib/server` and export the returned `handler`—avoid calling `runPromise` inside route files.\n> - On the server, run effects through `EffectRuntime.runPromise` from `@/lib/server`, typically after `provideOptionalAuth`, so cookies and per-request context are attached automatically.\n> - On the client, use `useEffectQuery`/`useEffectMutation` from `@/lib/EffectRuntime`; they already bind the managed runtime and tracing so you shouldn't call `EffectRuntime.run*` directly in components.\n> \n> ## Code Formatting & Lint Checks\n> Before declaring any task complete, the agent should run the fastest useful check for every file type it touched and report anything skipped.\n> \n> - **Rust**: `cargo fmt --all` and `cargo check -p \u003ccrate>` for the touched crate. Add `--all-targets`, `--workspace`, or `cargo clippy -p \u003ccrate> --all-targets -- -D warnings` only for explicit requests, CI/PR final validation, or changes that need broader coverage.\n> - **TS / JS / JSON / CSS / MD**: prefer scoped checks such as `bun run biome check --write \u003cfiles>`. Use full `bun run format`, `bun run lint`, and `bun run typecheck` only when explicitly requested or when the change is broad enough to justify it.\n> - If a scoped check fails, fix the violation in the source (do NOT suppress with `#[allow(...)]`, `// biome-ignore`, or `any` unless explicitly approved). The Pre-Generation Invariants show the correct form for every denied lint."},"directory-source-2":{"body":"# CONTRIBUTING.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Cap Contributor Guide\n> \n> ## Introduction\n> \n> ### What is Cap?\n> \n> Cap is an open source and privacy focused alternative to Loom. It's a video messaging tool that allows you to record, edit and share videos in seconds.\n> \n> The development of Cap is still in its early stages, so please bare with us as we build out this guide.\n> \n> ### What is this guide?\n> \n> This guide is for anyone who wants to contribute to Cap. It's a work in progress, and will be updated regularly.\n> \n> ### How can I contribute?\n> \n> There are many ways to contribute to Cap. You can:\n> \n> - [Report a bug](https://github.com/CapSoftware/cap/issues/new)\n> - [Suggest a feature (via Discord)](https://discord.com/invite/y8gdQ3WRN3)\n> - Submit a PR\n> \n> ## Running Cap\n> \n> ### Development Requirements\n> \n> Before anything else, make sure you have the following installed:\n> \n> - Node Version 20+\n> - Rust 1.88.0+\n> - Bun 1.4.0\n> - Docker ([OrbStack](https://orbstack.dev/) recommended)\n> \n> ### General Setup\n> \n> Keep the root `react` and `react-dom` development dependencies aligned with `apps/mobile`. They keep Expo native dependencies deduplicated under Bun’s hoisted linker, while the web app retains its separately resolved React version.\n> \n> Run `bun install`, then run `bun run env-setup` to generate a `.env` file configured for your environment.\n> It will ask you which apps you intend to run, whether you'd like to use Docker to run S3 (MinIO) and MySQL locally,\n> and allow you to provide overrides as needed.\n> \n> Then run `bun run cap-setup` to install native dependencies such as FFmpeg.\n> \n> On Windows, llvm, clang, and VCPKG must be installed.\n> On MacOS, cmake must be installed.\n> `bun run cap-setup` does not yet install these dependencies for you.\n> \n> To run both `@cap/desktop` and `@cap/web` together, use `bun run dev`.\n> To run only one of them, use `bun run dev:desktop` or `bun run dev:web` respectively.\n> \n> ### `@cap/desktop` (desktop app)\n> \n> When running `@cap/desktop` from a terminal on macOS,\n> you will need to grant permissions (screen recording, microphone, etc.) to the terminal, not the Cap app.\n> For example, if you run `bun run dev:desktop` in the macOS `Terminal.app`,\n> you will need to grant permissions to it instead of `Cap - Development.app`.\n> \n> #### Where are my recordings stored?\n> \n> You can find your recordings at `~/Library/Application Support/so.cap.desktop.dev/recordings` on macOS,\n> and `%programfiles%/so.cap.desktop.dev/recordings` on Windows.\n> \n> ### `@cap/web` (cap.so website)\n> \n> When running `bun run dev` or `bun run dev:web`, a MySQL database and MinIO S3 server will also be using Docker.\n> If you want to _only_ run the `@cap/web` NextJS app, `cd` into `./apps/web` and run `bun run dev`."},"directory-7":{"body":"# apps\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 5 条已整理规则\n  Default to no code comments：When writing or editing code in any language（applicable）\n  Never hand-edit generated files：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts（applicable）\n  Rust clippy-clean and post-edit checks：When modifying any Rust file in apps or crates（applicable）\n  TypeScript Biome formatting and linting：When modifying TS, JS, JSON, CSS, or MD files（applicable）\n  Never start additional dev servers：When executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-6":{"body":"# apps/cli\n\n## 本目录来源 / Local sources\n\n无已采集来源 / No collected sources\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 5 条已整理规则\n  Default to no code comments：When writing or editing code in any language（applicable）\n  Never hand-edit generated files：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts（applicable）\n  Rust clippy-clean and post-edit checks：When modifying any Rust file in apps or crates（applicable）\n  TypeScript Biome formatting and linting：When modifying TS, JS, JSON, CSS, or MD files（applicable）\n  Never start additional dev servers：When executing tasks or dev harness verification（appli executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-3":{"body":"# apps/cli/skill/cap-demo/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: cap-demo\n> description: Generate a cinematic 3D product-demo video from any URL — scouts the page, records it with virtual input, and treats it with Cap's 3D camera, brand background, and music.\n> ---\n> \n> # cap-demo\n> \n> Give it a URL, get back a short, cinematic product-demo video. The pipeline\n> scouts the page headlessly, shoots a headed browser with **virtual input only**\n> (CDP mouse/keyboard — the user's real cursor is never touched), records with\n> Cap's CLI, then treats the recording with Cap's 3D camera, a brand-matched\n> background gradient, a synthetic cursor, and music, and exports an mp4.\n> \n> > **macOS only (for now).** This skill records via Cap's window capture and\n> > resolves a cached Playwright Chromium under\n> > `~/Library/Caches/ms-playwright`, both of which are macOS-specific today.\n> > Apple Silicon is assumed (the bundled Chromium path is `chrome-mac-arm64`).\n> \n> ## The skill directory\n> \n> `\u003cskilldir>` below is the directory this `SKILL.md` was installed into. `cap\n> agents install` writes it next to the main `cap` skill, so it is one of:\n> \n> - Claude: `~/.claude/skills/cap-demo`\n> - Cursor: `~/.cursor/skills/cap-demo`\n> - Codex: `\u003cCODEX_HOME>/skills/cap-demo` (default `~/.codex/skills/cap-demo`)\n> \n> There is no `cap-demo` binary on PATH — the `cap-demo` command is just\n> `node \u003cskilldir>/cap-demo.mjs`. Alias it if you like:\n> \n> ```\n> alias cap-demo='node \u003cskilldir>/cap-demo.mjs'\n> ```\n> \n> ## Requirements\n> \n> - **macOS on Apple Silicon.** Windows/Linux are not supported yet.\n> - **Node 18+**, with `playwright-core` vendored into the skill. Run `npm\n>   install` once inside `\u003cskilldir>` on first use. It **reuses an already-cached\n>   Chromium** under `~/Library/Caches/ms-playwright`; if none is cached, run\n>   `npx playwright install chromium` once.\n> - **`python3`** and **`ffmpeg`/`ffprobe`** on PATH.\n> - The **`cap` CLI** on PATH (Cap Desktop, https://cap.so) with macOS\n>   **screen-recording permission** granted to it. Both stages otherwise resolve\n>   the binary from `CAP_BIN`; if neither is set they error clearly.\n> \n> ## One-liner\n> \n> ```\n> cap-demo https://website.com\n> ```\n> \n> Output lands at `\u003coutDir>/\u003cslug>-demo.mp4` (default `\u003ctmp>/cap-demo/\u003cslug>/\u003cslug>-demo.mp4`).\n> \n> ## Two modes\n> \n> - **Deterministic** (`cap-demo \u003curl>`): fixed heuristics, no agent in the loop.\n>   Scores the best CTA, picks click-through vs scroll, paints a brand gradient\n>   from the page colors, picks music by brand darkness. Good, ~70% quality. Use\n>   it for batch runs or when you cannot watch the frames.\n> - **Agent-driven recipe** (recommended, ~95% quality): the agent runs the\n>   same steps but frame-QAs each stage and applies judgment — sets the brand\n>   color by eye, matches export fps to the real capture rate, reshoots on a\n>   dead-end CTA, regrades until the beats read. This is the path that produced\n>   the shipped demos. Follow the recipe below.\n> \n> ## The agent recipe\n> \n> Run the two stages by hand so you can inspect between them. Both scripts live in\n> this skill; the orchestrator just chains them.\n> \n> ### 1. Scout + shoot\n> \n> ```\n> node \u003cskilldir>/lib/scout-shoot.mjs \u003curl> \u003coutDir> \u003cslug> [--story click|scroll]\n> ```\n> \n> - Writes the recording to `\u003coutDir>/\u003cslug>.cap` and the beat log to\n>   `\u003coutDir>/\u003cslug>.timeline.json`.\n> - Prints a final JSON line: `{\"slug\",\"story\",\"scout\":{title,hero,accent,pageBg,ctaText}}`.\n>   Read it to see what it decided (story, chosen CTA, brand colors).\n> - It already: kills stale test-chrome, closes Finder windows, dismisses cookie\n>   banners, injects the shimmer div, matches the capture window by exact page\n>   title (asserts a single match), and logs the virtual cursor path.\n> \n> **Story choice.** Leave it to auto for most sites (a strong content CTA →\n> `click`, otherwise `scroll`). Force `--story scroll` for product one-pagers that\n> showcase best as a scroll of their own sections, or when the top CTA dead-ends\n> at a booking/login page.\n> \n> ### 2. Frame-QA the raw recording (before treating)\n> \n> Extract a few beat frames and **look at them**:\n> \n> ```\n> ffmpeg -y -ss \u003ct> -i \u003coutDir>/\u003cslug>.cap/content/segments/segment-0/display.mp4 -frames:v 1 /tmp/raw-\u003ct>.png\n> ```\n> \n> Check: the right window/content is captured (no leftover footage from a prior\n> shoot), no cookie banner leaked in, the CTA click did **not** dead-end at a\n> booking calendar or login form, and the **end** of the clip is clean (no desktop\n> or Finder window bleeding into the bottom of the capture). If any of that is\n> wrong, reshoot with `--story scroll` or a better landmark before spending an\n> export.\n> \n> ### 3. Treat + export\n> \n> ```\n> python3 \u003cskilldir>/lib/treat.py \u003coutDir> \u003cslug> [--music ID] [--quality 4k|hd] [--bg-gradient FROM_HEX,TO_HEX]\n> ```\n> \n> - Aligns beats to video (tail-anchored: the video can be **shorter** than the\n>   event log — never trust event times blindly), trims dead time, aims three 3D\n>   shots at the logged landmarks, paints the brand gradient, synthesizes the\n>   cursor track from the bundled cursor assets, copies music, exports the mp4.\n> - **Set the brand background by eye** when the site is gradient-heavy or\n>   light/pastel: `getComputedStyle` lies on those (e.g. a site that looks white\n>   with lavender accents can sample as black). Look at the raw frames and pass\n>   `--bg-gradient FROM_HEX,TO_HEX` (light sites → a soft light gradient; dark\n>   sites → a deep tint of the brand hue).\n> - **Match export fps to the real capture rate.** `cap record --detach` can\n>   engage late and the window capture stalls timestamps on static pixels, so the\n>   true rate is often ~58, not 60. Check it and avoid the 58-vs-60 judder:\n>   `ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames,duration -of csv=p=0 \u003ccap>/content/segments/segment-0/display.mp4`,\n>   then pass `--quality hd` (60) only if the capture is really ~60, otherwise\n>   leave fps at the source rate (omit `--quality`).\n> \n> ### 4. Frame-QA the export, then regrade if needed\n> \n> Extract 4 beat frames from `\u003coutDir>/\u003cslug>-demo.mp4` and look: each beat\n> readable, a typing shot aimed at the **text-entry point** (not the field\n> center), no window/desktop bleed, clean fps, music fades feel right. If a shot\n> reads too tight or the aim is off, adjust and re-export. The reference 3D poses\n> were tuned on full-desktop captures; a browser-window capture fills the card\n> more, so distances can read ~30% too tight — back the zoom off if so.\n> \n> ### 5. Deliver\n> \n> Ship `\u003coutDir>/\u003cslug>-demo.mp4`.\n> \n> ## Hard editorial rules (encode these every time)\n> \n> - **12s max** total. The tail is shaved evenly if the cut runs long.\n> - **A camera cut MUST be a content cut.** Every 3D perspective change lands on a\n>   different section/page — the shot boundary sits exactly on the clip cut or the\n>   scroll into new content. Never cut the camera mid-idle.\n> - **Cut on action, trim dead time.** Cut on the click; resume on the loaded\n>   page. Trim page-loads and loading-state frames — never let a blur-up or\n>   spinner leak into a shot tail (frame-check the cut points).\n> - **Aim at content, not the container.** Shots are aimed at landmarks (hero, the\n>   clicked CTA, the destination header), not copied pans. Blur focus rides the\n>   aim.\n> - **One motion system.** All emphasis lives in the 3D shot (a dolly-in is the\n>   click punch). Never stack 2D zoom segments on 3D shots — the two systems fight\n>   and read as jarring.\n> - **Hands off.** Virtual input only; the user's real cursor/mouse is never\n>   moved. The on-screen cursor is synthesized post-hoc from the logged glide path.\n> \n> ## Options reference\n> \n> Orchestrator (`cap-demo \u003curl> [flags]`):\n> \n> - `--out DIR` — output directory (default `\u003ctmp>/cap-demo/\u003cslug>`).\n> - `--slug NAME` — project slug (default: the URL host, dashed).\n> - `--music ID` — music track id (see below). Default: chosen by brand darkness\n>   (dark → `lofi-cinematic-pulsebox`, light → `sunday-mood-lofi-cafe-upbeat-bluelike`).\n> - `--quality 4k|hd` — `4k` = 3840x2160 / 60fps / maximum / filesize-optimized;\n>   `hd` = 60fps / maximum. Omit for the source-rate default.\n> - `--story click|scroll` — force the storyboard (default: auto).\n> \n> `lib/treat.py` extra flags (when running the stages by hand):\n> \n> - `--bg-gradient FROM_HEX,TO_HEX` — override the brand gradient by eye\n>   (e.g. `--bg-gradient E4DCF8,C6BAEA` for a light lavender, or `261A40,0C0914`\n>   for a deep purple).\n> \n> **Bundled music** (a premium/dark/light/moody spread):\n> `lofi-cinematic-pulsebox` (moody/premium), `lofi-hip-hop-leberch` (dark),\n> `sunday-mood-lofi-cafe-upbeat-bluelike` (light/upbeat), `lofi-smooth-pulsebox`\n> (light/smooth). Music resolves only from the skill's bundled\n> `assets/music/\u003cid>.mp3`; an unknown id errors.\n> \n> **Binary resolution** (both scripts): Cap binary = env `CAP_BIN`, else `cap` on\n> PATH, else a clear error. Chromium = newest cached\n> `~/Library/Caches/ms-playwright/chromium-*` (macOS), else the pinned\n> `chromium-1228` build.\n> \n> ## For dev tools / typing showcases (closeup variant)\n> \n> For dev tools with a live terminal or code on screen, a bespoke storyboard beats\n> the generic click-through. Scout for `[class*=terminal]` / `pre` / `code`,\n> scroll each to center, dwell ~2.7s (live terminals animate = free motion). The\n> **closeup shot recipe**: a gentle tilt (tiltX 10-13, tiltY 9-13, rotateX -4) so\n> text stays legible, a tight slow push-in zoom (0.72-0.82), and blur focus locked\n> ON the element (focusX = the element's fraction, small focusSize ~0.55). Keep it\n> a single continuous clip (no editorial cut) so scrolls stay smooth — cuts are\n> 3D-only. Aim typing shots at the **text-entry region**, not the field center.\n> Rebuild a bespoke shoot from `lib/scout-shoot.mjs` as the base when a site\n> deserves it (edit a fresh copy — do not sed/splice shot arrays, overlapping\n> offsets corrupt the file)."},"directory-8":{"body":"# apps/cli/skill/cap\n\n## 本目录来源 / Local sources\n\n- apps/cli/skill/cap/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 5 条已整理规则\n  Default to no code comments：When writing or editing code in any language（applicable）\n  Never hand-edit generated files：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts（applicable）\n  Rust clippy-clean and post-edit checks：When modifying any Rust file in apps or crates（applicable）\n  TypeScript Biome formatting and linting：When modifying TS, JS, JSON, CSS, or MD files（applicable）\n  Never start additional dev servers：When executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-4":{"body":"# apps/cli/skill/cap/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: cap\n> description: >-\n>   Always use Cap's CLI or local MCP first when the user mentions Cap, a Cap URL, screen recording, the Cap\n>   library, transcripts, chapters, comments, reactions, sharing, analytics, organizations, storage, billing,\n>   or developer apps. Cap should be operated without browser automation or computer-use tools whenever its\n>   CLI or MCP surface supports the task. Requires the `cap` command from Cap Desktop (https://cap.so).\n> ---\n> \n> # Cap CLI\n> \n> ## Cap-first routing\n> \n> For every Cap task, use the local Cap MCP tools or `cap` CLI as the primary interface. Do not open, inspect, or\n> control the Cap dashboard, a Cap browser tab, or Cap Desktop through browser automation or computer-use tools\n> to discover, read, or manage data that the CLI or MCP can access. If MCP is unavailable in the current process,\n> use the CLI. If the CLI is missing, treat that as an installation problem rather than a reason to use the\n> dashboard.\n> \n> A browser is appropriate only for a focused authentication or provider-approval URL returned by a Cap command.\n> Let the user complete that handoff directly, then verify the result through the CLI or MCP. This installed skill\n> is the persistent routing rule for future sessions; do not depend on conversation memory to choose Cap.\n> \n> Start by reading the installed CLI's authoritative contract:\n> \n> ```sh\n> cap guide --json\n> ```\n> \n> Use `--json` for machine-readable output. Treat stdout as authoritative, stderr as diagnostics, exit code\n> `1` as a runtime failure, and exit code `2` as invalid usage. Do not guess output schemas that are available\n> from `cap guide --json` or `cap \u003ccommand> --help`.\n> \n> ## Cap library\n> \n> Authorize once with `cap auth login --json`. Login defaults to the least-privileged `creator` profile; request\n> `admin` or `full` only when the task requires it. Use `cap auth status --json` to verify the credential with the\n> server. For headless use, `CAP_AGENT_TOKEN` overrides the OS-stored credential. Existing Cap Desktop and\n> `CAP_API_KEY` credentials remain supported.\n> \n> Use `cap caps list --json` for discovery, `cap caps get \u003cid-or-url> --json` for lightweight metadata and\n> capabilities, and `cap caps context \u003cid-or-url> --json` for title, AI title, summary, chapters, transcript,\n> comments, reactions, views, sharing, permissions, and processing state.\n> \n> `cap caps wait \u003cid-or-url> --for transcript|ai|all --json` only observes existing processing. Reads and\n> waits must never be described as starting transcription, AI generation, or any paid work.\n> \n> Stream large content to disk:\n> \n> ```sh\n> cap caps transcript \u003cid-or-url> --format text --output transcript.txt --json\n> cap caps download \u003cid-or-url> --output recording.mp4 --json\n> ```\n> \n> For `PASSWORD_REQUIRED`, ask the user to run `cap caps unlock \u003cid-or-url>` in a secure terminal. Never request a\n> password in an agent prompt, argument, JSON object, log, or MCP tool call.\n> \n> Before any mutation, show the exact proposed action and obtain explicit user confirmation. This includes\n> posting or deleting content, changing metadata or visibility, starting paid processing, replacing transcripts,\n> moving or deleting Caps, changing membership or storage, creating checkout links, and rotating credentials.\n> Pass `--yes` or MCP `confirmed=true` only after that confirmation. Reads and waits do not require confirmation.\n> \n> ## Dashboard-independent management\n> \n> Use `cap account`, `cap organizations`, `cap library`, `cap notifications`, `cap analytics`, `cap developers`,\n> and `cap jobs` for account, organization, sharing, storage, billing, analytics, developer, and asynchronous\n> operation workflows. Inspect each command's current arguments with `--help`; do not reconstruct them from this\n> skill.\n> \n> Organization invites deliver email by default. Use `cap organizations invite add ... --no-email` only when the\n> user explicitly wants a link-only invite, and report the returned `emailDelivery` state.\n> \n> Some secure or local-file actions are intentionally CLI-only: Cap passwords, S3 credentials, profile and\n> organization images, and newly issued developer credentials. Never ask the user to paste those values into\n> chat or an MCP call. Ask them to run the exact secure terminal command. S3 accepts hidden prompts or\n> `--credentials-stdin`, never credential arguments.\n> \n> Stripe checkout, the billing portal, Google Drive authorization, and `cap account referrals` return a URL and\n> may open a browser. These are focused provider handoffs, not a dependency on the Cap dashboard. The agent may\n> continue after the user completes the handoff and should re-read state to verify the result.\n> \n> Use `cap jobs wait \u003coperationId> --json` for durable operations. Do not infer success from an accepted or queued\n> response. Warn that `cap account sign-out-all` revokes every device and agent session, including the current CLI\n> credential.\n> \n> Use `cap caps import loom \u003curl> --organization \u003cid> --yes --json` for Loom imports. Organization managers may\n> add `--owner-email` and `--space` to perform CSV-style migrations one durable, idempotent row at a time. Wait for\n> the returned operation before treating the import as complete.\n> \n> ## Local MCP\n> \n> `cap mcp serve` is a stdio server; its stdout is protocol-only. Prefer MCP for structured reads, safe writes,\n> resource links, and browser-handoff URLs. Fall back to the CLI for secure-input and local-file actions.\n> \n> Install MCP or this skill for one explicitly selected agent with\n> `cap agents install --target \u003cagent> --component skill|mcp|all --dry-run`. Review the preview, then rerun\n> interactively or with `--yes`. Never install into every detected agent automatically.\n> \n> When the user pasted Cap's official setup prompt, that prompt is explicit approval for the local CLI, skill, and\n> MCP bootstrap for the current agent. In that setup flow, apply the reviewed `--component all` plan with `--yes`\n> without asking the user to copy commands or approve the same local setup again. This does not authorize Cap\n> account, content, recording, upload, paid, billing, storage, developer, or destructive changes.\n> \n> ## Recording and sharing\n> \n> Check readiness with `cap doctor --json` and discover devices with `cap targets --json`. For an unknown\n> duration, use the detached lifecycle:\n> \n> ```sh\n> cap record start --screen \u003cid> --detach --json\n> cap record stop --id \u003crecordingId> --json\n> cap project validate \u003cpath.cap> --json\n> cap export \u003cpath.cap> --output out.mp4 --json\n> cap upload out.mp4 --json\n> ```\n> \n> A stopped recording is complete only when `recordingMetaExists` is `true`.\n> \n> ## Cinematic demo videos\n> \n> To generate a short, cinematic 3D product-demo video from a URL, use the installed\n> `cap-demo` skill (installed alongside this one). It scouts the page, records it with\n> virtual input, and treats it with Cap's 3D camera, a brand-matched background, and\n> music. Currently macOS-only."},"directory-9":{"body":"# apps/web\n\n## 本目录来源 / Local sources\n\n- apps/web/AGENTS.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 5 条已整理规则\n  Default to no code comments：When writing or editing code in any language（applicable）\n  Never hand-edit generated files：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts（applicable）\n  Rust clippy-clean and post-edit checks：When modifying any Rust file in apps or crates（applicable）\n  TypeScript Biome formatting and linting：When modifying TS, JS, JSON, CSS, or MD files（applicable）\n  Never start additional dev servers：When executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-5":{"body":"# apps/web/AGENTS.md\n\n类型：instruction\n\n记录作用域：apps/web\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> \u003c!-- BEGIN:nextjs-agent-rules -->\n> \n> # This is NOT the Next.js you know\n> \n> This version has breaking changes — APIs, conventions, and file structure may all differ from your training data. Read the relevant guide in `node_modules/next/dist/docs/` (resolved from this file's directory; in monorepos the `next` package may not be visible from the repo root) before writing any code. Heed deprecation notices.\n> \n> This block is written and re-added by `next dev` — verify at `node_modules/next/dist/server/lib/generate-agent-files.js`. Removing it from a diff only re-creates the uncommitted change; committing it with your work keeps the tree clean.\n> \n> \u003c!-- END:nextjs-agent-rules -->"},"directory-10":{"body":"# .agents/skills/building/references\n\n## 本目录来源 / Local sources\n\n- .agents/skills/building/references/editors.md · 0 条已整理规则\n\n- .agents/skills/building/references/environment.md · 0 条已整理规则\n\n- .agents/skills/building/references/desktop.md · 0 条已整理规则\n\n- .agents/skills/building/references/recording.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- AGENTS.md · 5 条已整理规则\n  Default to no code comments：When writing or editing code in any language（applicable）\n  Never hand-edit generated files：When touching **/tauri.ts, apps/desktop/src-tauri/gen/**, or packages/ui-solid/src/auto-imports.d.ts（applicable）\n  Rust clippy-clean and post-edit checks：When modifying any Rust file in apps or crates（applicable）\n  TypeScript Biome formatting and linting：When modifying TS, JS, JSON, CSS, or MD files（applicable）\n  Never start additional dev servers：When executing tasks or dev harness verification（applicable）\n- CONTRIBUTING.md · 0 条已整理规则\n\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 5 条规则，来自 1 份来源。AGENTS.md repository invariant rules and code quality standards。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-6":{"body":"# .agents/skills/building/references/editors.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Editor setup\n> \n> Keep the skill named `building` and the helper named `building.mjs`. The repository source is `.agents/skills/building/`. Install one persistent copy at `~/.agents/skills/building/`, including its scripts, references, package manifest, and lockfile. Never point a personal installation at a disposable worktree.\n> \n> | Editor | Personal discovery path | Invocation |\n> | --- | --- | --- |\n> | Cursor | `~/.cursor/skills/building` → `../../.agents/skills/building` | `/building \u003cfeature>` |\n> | Codex | `~/.agents/skills/building` | `$building \u003cfeature>` |\n> | Claude Code | `~/.claude/skills/building` → `../../.agents/skills/building` | `/building \u003cfeature>` |\n> \n> An existing `~/.codex/skills/building` installation can remain as a compatibility symlink to the shared directory so earlier absolute helper paths continue to resolve. Check existing destinations before adding links; never overwrite an unrelated skill. Resolve each editor's `SKILL.md` and helper to verify that they read the same files. Reopen a session if its skill list has not refreshed.\n> \n> Install the helper's pinned packages once with `npm ci --prefix ~/.agents/skills/building --ignore-scripts --no-audit --no-fund`. The helper uses Node, Git, and the provider CLIs/SDK, not editor-specific tool APIs. Configure provider credentials and MCP connections in the editor or runner being used. Prefer PlanetScale MCP when available and retain the CLI fallback. Browser verification can use that editor's browser tools or Playwright with the session's isolated profile.\n> \n> All three editors must operate through the same helper and Git-common session state, so their locks, port allocations, resource ownership checks, and cleanup coordinate across editors. Resume an existing session by ID; do not run two agents against the same session or create an editor-specific registry.\n> \n> These paths configure local editors. Remote/cloud workers need the skill package, dependencies, and scoped credentials installed on that worker; a local symlink does not provision a remote environment. Do not copy local secret files as part of the skill package.\n> \n> Discovery references: [Cursor](https://cursor.com/help/customization/skills), [Codex](https://learn.chatgpt.com/docs/build-skills), and [Claude Code](https://code.claude.com/docs/en/skills)."},"directory-source-7":{"body":"# .agents/skills/building/references/environment.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Environment setup\n> \n> The helper stores resumable session records under `\u003cgit-common-dir>/building/sessions/\u003cid>/`. These are machine-local, mode 0600, and outside the tracked worktree. Keep secrets out of tool output and PR bodies. Session IDs, resource identities, and source commits are recorded separately from credentials.\n> \n> The default Cap database configuration is organization `cap`, database `cap-production`, parent `main`; the owned development branch is `building-\u003csession-id>`. Verify that these names still describe the selected project before provisioning. MCP creation must copy schema only. Call `database-attach` to validate the actual ready, nonproduction branch, then `credentials` to create a seven-day development-only password. The admin role is limited to that branch and permits the required Drizzle schema push. Application production credentials are never copied.\n> \n> If credential creation is interrupted, inspect and revoke the password with the recorded name before clearing `passwordAttempted` under the session operation lock and trying again. Never print or reconstruct a secret from logs. If credentials expire, revoke the owned password and replace its private environment entry, preserving the resource identity.\n> \n> Use `run --session \u003cid> -- bun install --frozen-lockfile`. Each worktree keeps its own workspace links and dependency graph; Bun reuses its global download cache and macOS copy-on-write installs. Do not link the main checkout's `node_modules` into the worktree.\n> \n> Use the existing `db:generate` and `db:push` commands through `run` when the feature changes schema, then `seed`. The deterministic base fixture includes one test user with a simulated Pro entitlement, organization, membership, and folder. It does not create paid subscriptions, upload sample customer media, or exercise billing. Add feature-specific fixtures using synthetic media and only the session database.\n> \n> `login` creates a one-hour NextAuth browser storage state using the session's own secret and fixture identity. It requires the worktree's web dependencies. This supplies a real signed test session without adding a production authentication bypass. Capture uploads that file to the owned sandbox; walkthroughs can pass `/home/daytona/browser-state.json` to Playwright's browser context. Refresh it immediately before authenticated captures.\n> \n> `run` constructs the app environment from a small allowlist, never from the shared checkout's `.env`. Missing object storage points at an unreachable local endpoint. For upload features, provision a disposable bucket with credentials limited to that bucket and set `CAP_AWS_BUCKET`, `CAP_AWS_REGION`, `CAP_AWS_ENDPOINT`, `CAP_AWS_ACCESS_KEY`, and `CAP_AWS_SECRET_KEY` in the private `environment.json`; record its owner and cleanup obligation in the session. A bucket-name prefix alone is not credential isolation. Media processing needs its own test service, secret, and callback URL.\n> \n> For the web runtime, use `serve --session \u003cid> -- bun run --cwd apps/web dev --port \u003callocated-web-port> --hostname 127.0.0.1`. Do not use root `bun run dev` or commands that start/stop shared Docker services. Keep the wrapper alive as the process owner. `serve` uses a separate server lease so login, checks, and capture remain available while it runs; `run` serializes short setup commands. Recheck port availability at launch; allocation prevents building-session collisions but cannot reserve a port against unrelated processes indefinitely.\n> \n> The orchestrator is not an OS security boundary. Execute trusted, reviewed project code only. Untrusted fork changes require a sandbox without provider credentials; uploading their artifacts is a separate trusted step.\n> \n> Use `preview --session \u003cid>` for local browsing after starting `serve`. It uses installed Google Chrome with a private per-session profile and imports that session's generated login state. Do not open multiple feature URLs in the main browser profile: cookies ignore port numbers. `stop` and `finish` close owned previews and stop owned server process groups."},"directory-source-8":{"body":"# .agents/skills/building/references/desktop.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Desktop worktrees\n> \n> There are separate Tauri and GPUI Cargo workspaces and toolchains. Never assume one cache key or one native runtime verifies both.\n> \n> `warm --session \u003cid> --source \u003cidle-checkout>` snapshots prepared native dependencies into the Git-common cache, then creates a private copy-on-write clone in the worktree. `--rust` also warms `target/debug` and `apps/desktop-gpui/target/debug`. It excludes profiles, user media, release artifacts, and arbitrary contents of `target`.\n> \n> The helper requires matching setup script, lockfiles, and toolchain files, uses a cache lock, checks for open files in the source, and refuses to overwrite existing destinations. Compiled Rust snapshots also require matching source trees, local changes, and both workspaces' Cargo configuration, including ignored configuration files. Prepare matching build configuration before `--rust`; use the default native-dependency-only warm when source or configuration differs. macOS uses `cp -cR`; Linux requires a filesystem supporting `cp --reflink=always`. There is no silent full-copy fallback. On unsupported filesystems, use fresh builds with compiler caching or a deliberately provisioned build runner.\n> \n> Only seed caches from a quiescent, owned checkout whose build processes have stopped. Open-file checks do not prevent an unrelated process from starting a new build; do not use a live shared developer checkout as an automatically refreshed cache source. Cache snapshots are immutable by convention. Setup, signing, formatting, and compiler writes happen in each worktree's private clone.\n> \n> APFS clones initially share unchanged blocks but grow as builds diverge. Always run Cargo in the destination before using a warmed binary: the snapshot does not prove which environment flags or toolchain binary produced the original artifacts. Cargo may rebuild because of source paths, toolchain, flags, or changed workspace crates. Measure `df` before and after real parallel builds to assess physical growth; `du` totals do not prove unique APFS usage. Do not promise a zero-space worktree or automatic reuse of every Rust artifact.\n> \n> The existing setup script supports opt-in `CAP_USE_SCCACHE=1`; evaluate it with the actual workload. Rust incremental compilation and sccache have compatibility constraints, and final executable linking is not cached. Never globally disable incremental compilation or rewrite another worktree's Cargo configuration to force caching.\n> \n> Native runtime isolation is separate from build isolation. Cap has single-instance behavior, fixed frontend ports, device permissions, deep-link handlers, keychain credentials, and persisted application data. `run --native` acquires an exclusive machine-local lease; that lease coordinates this workflow only and does not establish an isolated app profile.\n> \n> Use `run --native` and `check --native` for expensive Rust compilation as well. This queues native work across sessions instead of launching twenty large builds at once. Complete compile checks before holding the lease with a long-lived native runtime. Source editing and independent web work can continue while a native job waits.\n> \n> For v1, prefer a dedicated native runner/OS user with synthetic recordings and test credentials. Before any local native launch, explicitly verify its app identifier, data directory, recording library, frontend port, authentication callback, and existing process ownership. Do not launch it against the user's normal Cap profile. Native profile provisioning and parallel local Tauri/GPUI launch are not automated by this helper.\n> \n> Use the platform's actual Cap CLI to capture native demos. Linux Daytona evidence cannot close macOS ScreenCaptureKit, Windows capture, hardware GPU, microphone/camera, permissions, or updater gates. Retain a platform matrix in the PR and keep it draft when required native verification is missing."},"directory-source-9":{"body":"# .agents/skills/building/references/recording.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Recorded PR review\n> \n> Use a trusted Linux Daytona snapshot with a known-good Cap CLI, browser, and required native libraries. The helper sets `VNC_RESOLUTION=1920x1080` at creation and verifies the actual display. This setting applies to Linux container sandboxes; do not assume it changes Windows or VM geometry. Local upload uses the installed authenticated Cap CLI, so its credential never enters Daytona.\n> \n> The runner dependency is pinned in this skill's package lock. Supply `DAYTONA_API_KEY` to the host process through existing secure configuration, not an argument or recipe. Recipe files and walkthrough code must be committed in the feature worktree. The sandbox receives `git archive` of the exact verified commit, not uncommitted local files. Review source provenance, the complete feature diff and dependency changes, and every setup/start/readiness/walkthrough command and network destination before trusting the capture. A tracked recipe or a passing test is not evidence that fork-controlled code is trusted.\n> \n> Credentialed captures require a private review receipt before any sandbox is created. After actually completing that review, record `sha`, the recipe file's SHA-256 as `recipeHash`, the private session `environment.json` file's SHA-256 as `environmentHash`, `sourceTrusted: true`, `commandsReviewed: true`, `credentialScopesReviewed: true`, and an ISO `reviewedAt` timestamp in a private JSON file. Use `capture-review --session \u003cid> --recipe \u003cpath> --evidence \u003cfile>` to bind the review to the exact source, recipe, and credential configuration. A later commit, recipe edit, credential rotation, or service-configuration change requires a new review. The helper rechecks the configuration fingerprint when loading the app's environment after waiting for the capture slot. Never generate this receipt just to pass the gate: verify that database and storage credentials are restricted to disposable synthetic fixtures. Untrusted forks remain on `database: false` without credentials or browser login state until independently reviewed.\n> \n> The sandbox's initial environment and the setup, readiness, walkthrough, and recorder commands receive no configured credentials. Only the reviewed `start` command receives the session's development credentials, after setup completes; it runs in the background with private logs. Put credentialed application startup in `start`, not in setup or walkthrough commands. These phases share an OS user, so environment separation is defense in depth, not an OS boundary against malicious code. Do not approve untrusted source for this mode.\n> \n> A recipe has this shape:\n> \n> ```json\n> {\n> \t\"version\": 1,\n> \t\"platform\": \"linux\",\n> \t\"snapshot\": \"daytona-small\",\n> \t\"setup\": [\"bun install --frozen-lockfile\"],\n> \t\"start\": \"bun run --cwd apps/web dev --port \\\"$PORT\\\" --hostname 127.0.0.1\",\n> \t\"ready\": \"node scripts/feature-demo/wait-for-server.mjs\",\n> \t\"walkthrough\": \"node scripts/feature-demo/walkthrough.mjs\"\n> }\n> ```\n> \n> The paths above illustrate feature-owned scripts, not existing commands. Implement them for the feature. Their readiness checks must be bounded, and the walkthrough must fail on an incorrect outcome. Use Playwright for browser interaction and assertions, with a headed browser and a fixed viewport. Provide readable pauses around meaningful states, aiming for 20–60 seconds. Keep credentials, customer data, and unrelated windows off-screen.\n> \n> The snapshot must already contain `cap` on PATH, or the recipe must install a reviewed, pinned release before capture. Inspect `cap guide --json`, `cap doctor --json`, and screen targets. The official installer is at `https://cap.so/install-cli.sh`, but do not execute an unreviewed downloaded installer or silently change the recorder version during retries. Record the recorder version in the verification notes.\n> \n> `database` defaults to true. Set it false only for a demonstration that cannot access application data, such as a build-tooling smoke test. Otherwise the runner verifies the owned development branch and supplies its isolated configuration. External service fixtures must work from inside Daytona; host-local addresses are not reachable there.\n> \n> Run `capture --session \u003cid> --recipe \u003cabsolute-recipe-path>`. The helper starts Cap, executes the walkthrough, stops/finalizes the recording, validates and exports it, downloads the MP4, and checks video dimensions/duration using local `ffprobe`. It deletes the owned sandbox in cleanup and sets provider expiration limits as a backstop. Do not treat an MP4's existence as visual verification: watch the exported file and confirm the intended feature is visible and behaves correctly.\n> \n> If sandbox creation has an uncertain result, locate the saved name and labels and run `sandbox-cleanup`; do not create a replacement until ownership is reconciled. If recording or a walkthrough fails, retain available artifacts and diagnose it. Failed evidence is never accepted as a passing capture. The helper's timeouts bound individual commands; provider TTL bounds abandoned sandboxes.\n> \n> After creating a draft PR, record its URL using `pr`, then call `share`. Uploads are named `#\u003cPR> — \u003cfeature> — \u003ccommit>` and moved into the personal root `PR's` folder within the user's default Cap organization. Folder creation, lookup, and the move all use the personal library; placement is verified through the Cap's own folder and organization fields. This does not create an organization share or change the recording's visibility. Folder identity is saved for retries. Never create duplicate folders or blindly retry an upload with an uncertain result. Reconcile by the saved title and metadata, then persist the discovered upload ID/link under the session lock.\n> \n> Open the resulting Cap share page and verify playable video and intended reviewer access. Keep organization-private visibility if appropriate; public GitHub reviewers require a deliberately public recording containing only synthetic data. Setting visibility is separate from creating a share URL. Do not mark the PR ready with an inaccessible or unplayed recording.\n> \n> Use the ELI5/recording/check template from `pr-body`, then add actual platform coverage and schema-deployment notes. The helper rejects stale SHA evidence. CI and review also need the current PR head. A later fix can require a new recording; retain prior Caps as historical evidence rather than deleting them.\n> \n> After actually checking playback and reviewer access, save a private browser receipt with `sha`, `url`, `played: true`, `reviewerAccess: true`, and `observedAt`, then run `video-verified --evidence \u003cfile>`. This records observed browser evidence; do not fabricate it from upload metadata. Run `finish` as part of PR completion to release the database, server processes, and published worktree immediately. Retained source and seed recipes let `resume` rebuild a follow-up environment.\n> \n> Cost defaults: one recording slot per local repository, 15-minute idle stop, 45-minute sandbox TTL, and deletion after artifact download. The SDK snapshots determine CPU/RAM allocation; use a small prepared Linux snapshot for browser demos, and opt into larger/native/GPU runners only for a concrete verification need. Keep expensive compilation out of the recording stage by preparing snapshots. Provider quotas may queue or reject work even when source worktrees are independent. Database passwords expire after seven days, but password expiry does not stop database billing: `finish` must delete the branch. On a blocked or abandoned run, reconcile and delete owned paid resources while retaining source and failed local evidence."}}},"snapshot":"9ed74ad21225c0fe1b7d698fe21eeb6c601c88ba","scope":"AGENTS.md repository invariant rules and code quality standards","rules":[{"id":"rule-no-code-comments","modules":["desktop-ui","cli-tool","desktop-harness","media-pipeline","editor-engine","os-platform","shared-packages"]},{"id":"rule-no-edit-generated-files","modules":["desktop-harness","shared-packages"]},{"id":"rule-rust-clean-first-time","modules":["desktop-ui","cli-tool","media-pipeline","editor-engine","os-platform"]},{"id":"rule-biome-clean-first-time","modules":["desktop-harness","shared-packages"]},{"id":"rule-no-extra-dev-servers","modules":["desktop-ui","desktop-harness"]}]}};
